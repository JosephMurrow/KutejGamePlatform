services:
  db:
    image: postgres:17-alpine
    container_name: pricetitute-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricetitute
      POSTGRES_PASSWORD: pricetitute
      POSTGRES_DB: pricetitute
    ports:
      - "5432:5432"
    volumes:
      - pricetitute-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricetitute -d pricetitute"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Песочница для писем: наружу ничего не уходит, всё видно в браузере
  # на http://localhost:8025. Без неё отлаживать почту нечем.
  mail:
    image: axllent/mailpit:latest
    container_name: pricetitute-mail
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP для приложения
      - "8025:8025" # веб-интерфейс

volumes:
  pricetitute-db-data:
